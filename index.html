<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Медитация — Таймер</title>
  <style>
    :root {
      --timer-color: #cdd9e0;
      --card-bg: rgba(22, 22, 26, 0.42);
      --card-border: rgba(255, 255, 255, 0.09);
      --fg: #f0f0f2;
      --fg-dim: rgba(240, 240, 242, 0.55);
      --accent: #7c93f5;
      --accent-strong: #93a6ff;
      --field-bg: rgba(255, 255, 255, 0.06);
      --field-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      overflow: hidden;
      background: #111;
      -webkit-font-smoothing: antialiased;
    }

    #bg {
      position: fixed;
      inset: 0;
      background-color: #111;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image .4s ease;
      z-index: 0;
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 55% 40% at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.15) 55%, rgba(0, 0, 0, 0) 80%);
    }

    #center {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
      text-align: center;
    }

    #modeLabel {
      color: var(--timer-color);
      letter-spacing: 4px;
      font-size: 50px;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 25px;
      text-shadow: 0 5px 17px rgba(1, 1, 1, 1.5);
    }

    #timeDisplay {
      color: var(--timer-color);
      font-size: 8rem;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    #timeDisplay.done {
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @media (max-width: 700px) {
      #timeDisplay {
        font-size: 4rem;
      }
    }

    /* ---------- Settings card ---------- */

    .auto-hide {
      transition: opacity .3s ease, transform .3s ease;
    }

    .auto-hide.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    #panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 250px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--fg);
      padding: 14px;
    }

    #panel::-webkit-scrollbar {
      width: 6px;
    }

    #panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    @media (max-width: 560px) {
      #panel {
        left: 12px;
        right: 12px;
        top: 12px;
        width: auto;
      }
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-dim);
      font-size: 14px;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--fg);
    }

    .section {
      margin-bottom: 12px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-bottom: 9px;
    }

    /* duration steppers */
    .duration-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .duration-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .duration-item>span {
      font-size: 13px;
      color: var(--fg-dim);
      flex-shrink: 0;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 9px;
      overflow: hidden;
    }

    .step-btn {
      width: 26px;
      height: 30px;
      border: none;
      background: transparent;
      color: var(--fg);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      transition: background .15s ease;
    }

    .step-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .stepper input[type=number] {
      width: 38px;
      border: none;
      background: transparent;
      color: var(--fg);
      text-align: center;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    .stepper input[type=number]::-webkit-outer-spin-button,
    .stepper input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .stepper input[type=number]:focus {
      outline: none;
    }

    /* floating controls under the timer (always visible) */
    #underControls {
      display: flex;
      gap: 18px;
      margin-top: 24px;
      pointer-events: auto;
    }

    /* mode-switch button, fixed at the bottom center of the screen (always visible) */
    #modeToggle {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
    }

    #modeToggle:hover {
      transform: translateX(-50%) translateY(-1px);
    }

    /* fullscreen button, fixed at the top-right corner (always visible, above the panel) */
    #fullscreenBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 11;
    }

    .mini-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.05);
      color: var(--timer-color);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0.7;
      transition: opacity .15s ease, background .15s ease, transform .12s ease;
    }

    .mini-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-1px);
    }

    .hint-text {
      margin-top: 9px;
      font-size: 11.5px;
      color: var(--fg-dim);
      text-align: center;
    }

    kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--field-border);
      border-radius: 5px;
      background: var(--field-bg);
      color: var(--fg);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
    }

    /* background upload */
    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 12px;
      border: 1px dashed var(--field-border);
      border-radius: 10px;
      background: var(--field-bg);
      color: var(--fg-dim);
      font-size: 12.5px;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
      margin-bottom: 10px;
    }

    .upload-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--fg);
      border-color: rgba(255, 255, 255, 0.25);
    }

    #gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-height: 140px;
      overflow-y: auto;
    }

    #gallery:empty {
      display: none;
    }

    .thumb {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 9px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      transition: border-color .15s ease, transform .12s ease;
    }

    .thumb:hover {
      transform: scale(1.04);
    }

    .thumb.active {
      border-color: var(--accent);
    }

    .thumb .del {
      position: absolute;
      top: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      width: 18px;
      height: 18px;
      font-size: 12px;
      line-height: 18px;
      text-align: center;
      border-radius: 0 0 0 8px;
    }

    .thumb .del:hover {
      background: rgba(220, 60, 60, 0.9);
    }
  </style>
</head>

<body>

  <div id="bg"></div>
  <div id="vignette"></div>

  <div id="center">
    <div id="modeLabel">Baba Nam Kevalam</div>
    <div id="timeDisplay">20:00</div>
    <div id="underControls">
      <button id="startPause" class="mini-btn" title="Старт">▶</button>
      <button id="reset" class="mini-btn" title="Сброс">↺</button>
    </div>
  </div>

  <button id="modeToggle" class="mini-btn" title="Переключить режим">⇄</button>
  <button id="fullscreenBtn" class="mini-btn" title="Полный экран (F)">⛶</button>

  <div id="panel" class="auto-hide hidden">
    <div class="panel-header">
      <span class="panel-title">Настройки</span>
      <button id="hideBtn" class="icon-btn" title="Скрыть панель (H)">✕</button>
    </div>

    <div class="section">
      <div class="section-label">Длительность, мин</div>
      <div class="duration-row">
        <div class="duration-item">
          <span>Baba Nam Kevalam</span>
          <div class="stepper">
            <button type="button" class="step-btn" data-target="durKiirtan" data-delta="-1">−</button>
            <input type="number" id="durKiirtan" min="1" max="180" value="20">
            <button type="button" class="step-btn" data-target="durKiirtan" data-delta="1">+</button>
          </div>
        </div>
        <div class="duration-item">
          <span>Медитация</span>
          <div class="stepper">
            <button type="button" class="step-btn" data-target="durMeditation" data-delta="-1">−</button>
            <input type="number" id="durMeditation" min="1" max="180" value="20">
            <button type="button" class="step-btn" data-target="durMeditation" data-delta="1">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Фон</div>
      <label for="upload" class="upload-btn">+ Добавить фото</label>
      <input type="file" id="upload" accept="image/*" hidden>
      <div id="gallery"></div>
    </div>

    <div class="hint-text">Нажмите <kbd>H</kbd> — показать/скрыть панель, <kbd>F</kbd> — полный экран</div>
  </div>


  <script>
    (function () {
      const LS_KEYS = {
        images: 'med_images',            // legacy, migrated to IndexedDB
        activeImage: 'med_active_image', // legacy, migrated to IndexedDB
        durations: 'med_durations',
        mode: 'med_mode'
      };

      const modeLabel = document.getElementById('modeLabel');
      const timeDisplay = document.getElementById('timeDisplay');
      const panel = document.getElementById('panel');
      const bg = document.getElementById('bg');
      const gallery = document.getElementById('gallery');
      const upload = document.getElementById('upload');
      const startPauseBtn = document.getElementById('startPause');
      const resetBtn = document.getElementById('reset');
      const hideBtn = document.getElementById('hideBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const modeToggleBtn = document.getElementById('modeToggle');
      const durKiirtanInput = document.getElementById('durKiirtan');
      const durMeditationInput = document.getElementById('durMeditation');

      let durations = JSON.parse(localStorage.getItem(LS_KEYS.durations) || 'null') || { kiirtan: 20, meditation: 20 };
      let mode = localStorage.getItem(LS_KEYS.mode) || 'kiirtan';
      let remaining = durations[mode] * 60;
      let running = false;
      let timerInterval = null;

      durKiirtanInput.value = durations.kiirtan;
      durMeditationInput.value = durations.meditation;

      function saveDurations() {
        localStorage.setItem(LS_KEYS.durations, JSON.stringify(durations));
      }

      function formatTime(sec) {
        sec = Math.max(0, Math.round(sec));
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function render() {
        modeLabel.textContent = mode === 'kiirtan' ? 'Baba Nam Kevalam' : 'Медитация';
        timeDisplay.textContent = formatTime(remaining);
        timeDisplay.classList.toggle('done', remaining <= 0);
        modeToggleBtn.title = mode === 'kiirtan' ? 'Переключить на Медитация' : 'Переключить на Baba Nam Kevalam';
        startPauseBtn.textContent = running ? '⏸' : '▶';
        startPauseBtn.title = running ? 'Пауза' : 'Старт';
      }

      function setMode(newMode) {
        stopTimer();
        mode = newMode;
        localStorage.setItem(LS_KEYS.mode, mode);
        remaining = durations[mode] * 60;
        render();
      }

      function tick() {
        remaining -= 1;
        if (remaining <= 0) {
          remaining = 0;
          stopTimer();
          beep();
        }
        render();
      }

      function startTimer() {
        if (remaining <= 0) remaining = durations[mode] * 60;
        running = true;
        timerInterval = setInterval(tick, 1000);
        render();
      }

      function stopTimer() {
        running = false;
        clearInterval(timerInterval);
        timerInterval = null;
        render();
      }

      function beep() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 3200;
          const master = ctx.createGain();
          master.gain.value = 0.35;
          master.connect(filter);
          filter.connect(ctx.destination);

          const fundamental = 196; // тёплый низкий тон, как у гонга
          const partials = [
            { ratio: 1, gain: 1.00, decay: 7.5 },
            { ratio: 1.99, gain: 0.55, decay: 6.5 },
            { ratio: 2.42, gain: 0.35, decay: 5.5 },
            { ratio: 3.86, gain: 0.22, decay: 4.5 },
            { ratio: 5.40, gain: 0.14, decay: 3.5 },
          ];
          const now = ctx.currentTime;
          partials.forEach(p => {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = fundamental * p.ratio;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, now);
            g.gain.exponentialRampToValueAtTime(p.gain, now + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, now + p.decay);
            osc.connect(g);
            g.connect(master);
            osc.start(now);
            osc.stop(now + p.decay + 0.2);
          });
        } catch (e) { }
      }

      startPauseBtn.addEventListener('click', () => {
        if (running) stopTimer(); else startTimer();
      });
      resetBtn.addEventListener('click', () => {
        stopTimer();
        remaining = durations[mode] * 60;
        render();
      });
      modeToggleBtn.addEventListener('click', () => setMode(mode === 'kiirtan' ? 'meditation' : 'kiirtan'));

      durKiirtanInput.addEventListener('change', () => {
        let v = Math.max(1, Math.min(180, parseInt(durKiirtanInput.value, 10) || 20));
        durKiirtanInput.value = v;
        durations.kiirtan = v;
        saveDurations();
        if (mode === 'kiirtan' && !running) { remaining = v * 60; render(); }
      });
      durMeditationInput.addEventListener('change', () => {
        let v = Math.max(1, Math.min(180, parseInt(durMeditationInput.value, 10) || 20));
        durMeditationInput.value = v;
        durations.meditation = v;
        saveDurations();
        if (mode === 'meditation' && !running) { remaining = v * 60; render(); }
      });

      document.querySelectorAll('.step-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          const delta = parseInt(btn.dataset.delta, 10);
          let v = (parseInt(input.value, 10) || 0) + delta;
          v = Math.max(1, Math.min(180, v));
          input.value = v;
          input.dispatchEvent(new Event('change'));
        });
      });

      // ---- Background image (single original file stored in IndexedDB, no recompression) ----

      const DB_NAME = 'med_timer';
      const DB_STORE = 'files';
      const BG_KEY = 'background';
      let bgUrl = null;

      function openDb() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function dbRequest(mode, fn) {
        const db = await openDb();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(DB_STORE, mode);
          const req = fn(tx.objectStore(DB_STORE));
          tx.oncomplete = () => { db.close(); resolve(req.result); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        });
      }
      const loadBackground = () => dbRequest('readonly', s => s.get(BG_KEY));
      const saveBackground = (blob) => dbRequest('readwrite', s => s.put(blob, BG_KEY));
      const deleteBackground = () => dbRequest('readwrite', s => s.delete(BG_KEY));

      // Blobs are shown as data: URLs, not blob: URLs — Railway's CSP allows
      // "img-src data:" but not "img-src blob:".
      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      async function showBackground(blob) {
        bgUrl = blob ? await blobToDataUrl(blob) : null;
        bg.style.backgroundImage = bgUrl ? `url(${bgUrl})` : 'none';
        renderGallery();
      }

      function renderGallery() {
        gallery.innerHTML = '';
        if (!bgUrl) return;
        const div = document.createElement('div');
        div.className = 'thumb active';
        div.style.backgroundImage = `url(${bgUrl})`;
        const del = document.createElement('div');
        del.className = 'del';
        del.textContent = '×';
        del.title = 'Удалить';
        del.addEventListener('click', async (e) => {
          e.stopPropagation();
          await deleteBackground();
          await showBackground(null);
        });
        div.appendChild(del);
        gallery.appendChild(div);
      }

      // data: URL -> Blob without fetch() — Railway's CSP blocks "connect-src data:".
      function dataUrlToBlob(dataUrl) {
        const [header, base64] = dataUrl.split(',');
        const mime = header.match(/:(.*?);/)[1];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      // One-time migration of the old compressed image from localStorage
      async function migrateLegacyImage() {
        const legacy = JSON.parse(localStorage.getItem(LS_KEYS.images) || '[]');
        if (legacy.length) {
          const activeId = localStorage.getItem(LS_KEYS.activeImage);
          const img = legacy.find(i => i.id === activeId) || legacy[0];
          const blob = dataUrlToBlob(img.data);
          if (!(await loadBackground())) await saveBackground(blob);
        }
        localStorage.removeItem(LS_KEYS.images);
        localStorage.removeItem(LS_KEYS.activeImage);
      }

      async function initBackground() {
        try {
          await migrateLegacyImage();
          await showBackground(await loadBackground());
        } catch (err) {
          console.error('Не удалось загрузить фон', err);
        }
      }

      upload.addEventListener('change', async () => {
        // Only one background is kept: a new upload replaces the previous one.
        const file = upload.files && upload.files[0];
        if (file) {
          try {
            await saveBackground(file);
            await showBackground(file);
          } catch (err) {
            console.error('Не удалось загрузить изображение', err);
          }
        }
        upload.value = '';
      });

      // ---- Panel visibility (closed by default, toggled with H) ----

      let panelVisible = false;
      function setPanelVisible(visible) {
        panelVisible = visible;
        panel.classList.toggle('hidden', !visible);
      }

      hideBtn.addEventListener('click', () => setPanelVisible(false));

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => { });
        } else {
          document.exitFullscreen?.();
        }
      }
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'h' || e.key === 'H') {
          setPanelVisible(!panelVisible);
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });

      // ---- Init ----
      render();
      initBackground();
    })();
  </script>

</body>

</html>
